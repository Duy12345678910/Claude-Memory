<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài tập Ngữ văn 8</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2530;--mut:#5d6b7a;--ac:#2f6fed;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e242b;--tx:#e8edf2;--mut:#9aa7b4;--ac:#6b9bff;--ok:#4cc38a}}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.bar{height:10px;background:#8883;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 4px #0002}
.card.done{border-left:6px solid var(--ok)}
.hint{color:var(--mut);font-size:15px}
textarea{width:100%;box-sizing:border-box;min-height:90px;font:inherit;padding:10px;border-radius:10px;border:1px solid #8886;background:var(--bg);color:var(--tx)}
button{margin-top:8px;font:inherit;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.st{margin-left:10px;color:var(--ok);font-size:15px}
</style></head><body><main>
<h1>Bài tập Ngữ văn 8</h1>
<div id="prog" class="hint"></div><div class="bar"><i id="fill"></i></div>
<div id="list"></div>
<p class="hint">Trả lời xong thì nhắn Claude "xong" để bạn ấy đọc.</p>
</main>
<script>
let S={questions:[],answers:{}};
const $=s=>document.querySelector(s);
function prog(){const n=S.questions.filter(q=>(S.answers[q.id]||"").trim()).length;
 $("#prog").textContent="Đã làm "+n+"/"+S.questions.length;
 $("#fill").style.width=(S.questions.length?100*n/S.questions.length:0)+"%"}
function render(){
 $("#list").innerHTML="";
 S.questions.forEach((q,i)=>{
  const d=document.createElement("div");d.className="card";
  const t=document.createElement("b");t.textContent=(i+1)+". "+q.title;
  const p=document.createElement("p");p.textContent=q.q;
  const h=document.createElement("p");h.className="hint";h.textContent="Gợi ý: "+q.hint;
  const ta=document.createElement("textarea");ta.value=S.answers[q.id]||"";
  const b=document.createElement("button");b.textContent="Lưu";
  const st=document.createElement("span");st.className="st";
  if(ta.value.trim())d.classList.add("done");
  b.onclick=async()=>{
   try{const r=await fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:q.id,text:ta.value})});
    if(!r.ok)throw 0;S.answers[q.id]=ta.value;st.textContent="Đã lưu ✓";
    d.classList.toggle("done",!!ta.value.trim());prog()}
   catch(e){st.textContent="Lỗi, thử lại"}};
  d.append(t,p,h,ta,b,st);$("#list").append(d)});
 prog()}
fetch("/api/state").then(r=>r.json()).then(s=>{S=s;render()});
</script></body></html>
