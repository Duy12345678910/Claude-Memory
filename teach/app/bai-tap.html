<title>Vở bài tập Văn 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
/* Layout: one narrow column like a school notebook page; each exercise is a ruled block. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1b2430; --muted:#5b6878;
  --line:#d5dde8; --accent:#2457c5; --done:#1d8a52; --note:#fff6d8; --note-ink:#5a4600;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif; --f-head:"Literata",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --paper:#1b212a; --ink:#e6ebf2; --muted:#9aa7b7;
  --line:#2c3542; --accent:#7fa6ff; --done:#4fc58a; --note:#3a3214; --note-ink:#f3df9c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --paper:#1b212a; --ink:#e6ebf2; --muted:#9aa7b7;
  --line:#2c3542; --accent:#7fa6ff; --done:#4fc58a; --note:#3a3214; --note-ink:#f3df9c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1{font:600 26px/1.2 var(--f-head);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.prog{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex.done{border-color:var(--done)}
.head{display:flex;gap:10px;align-items:baseline}
.num{font:600 15px var(--f-head);color:var(--accent);flex:none}
.title{font-weight:700;margin:0;min-width:0}
.chip{margin-left:auto;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--muted);flex:none}
.ex.done .chip{background:var(--done);color:var(--paper)}
.q{margin:0;white-space:pre-wrap}
.hint{margin:0;color:var(--muted);font-size:15px}
textarea{width:100%;box-sizing:border-box;min-height:96px;font:inherit;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font:500 16px var(--f-body);padding:9px 20px;border:0;border-radius:10px;background:var(--accent);color:var(--paper);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.st{font-size:14px;color:var(--muted)}
.fb{background:var(--note);color:var(--note-ink);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.fb b{display:block;margin-bottom:2px}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.foot{color:var(--muted);font-size:14px;text-align:center}
</style>

<div class="wrap">
  <header>
    <h1>Vở bài tập Văn 8</h1>
    <p class="sub">Ôn cuối kì 1 · Kết nối tri thức. Gõ câu trả lời, bấm Lưu. Claude đọc được và chấm ngay trên trang này.</p>
  </header>
  <div class="prog"><span id="progText">Đã làm 0/0</span><div class="bar"><i id="fill"></i></div></div>
  <div id="list"><p class="empty" id="empty">Đang tải bài tập…</p></div>
  <p class="foot">Làm xong thì nhắn Claude “xong”. Nhận xét của Claude sẽ hiện trong ô vàng dưới mỗi câu.</p>
</div>

<script>
const $ = s => document.querySelector(s);
let questions = [], answers = {}, feedback = {};
const cards = {};   // qid -> {el, ta, st, fb, chip}

function progress(){
  const n = questions.filter(q => (answers[q.id] || "").trim()).length;
  $("#progText").textContent = "Đã làm " + n + "/" + questions.length;
  $("#fill").style.width = (questions.length ? 100 * n / questions.length : 0) + "%";
}

function card(q, i, db){
  const el = document.createElement("section"); el.className = "ex";
  const head = document.createElement("div"); head.className = "head";
  const num = document.createElement("span"); num.className = "num"; num.textContent = "Câu " + (i + 1);
  const t = document.createElement("p"); t.className = "title"; t.textContent = q.title || "";
  const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = "Chưa làm";
  head.append(num, t, chip);
  const qq = document.createElement("p"); qq.className = "q"; qq.textContent = q.q || "";
  const h = document.createElement("p"); h.className = "hint"; h.textContent = q.hint ? "Gợi ý: " + q.hint : "";
  h.hidden = !q.hint;
  const ta = document.createElement("textarea"); ta.id = "ans-" + q.id; ta.placeholder = "Gõ câu trả lời ở đây…";
  const row = document.createElement("div"); row.className = "row";
  const b = document.createElement("button"); b.textContent = "Lưu";
  const st = document.createElement("span"); st.className = "st";
  row.append(b, st);
  const fb = document.createElement("div"); fb.className = "fb"; fb.hidden = true;
  el.append(head, qq, h, ta, row, fb);

  b.onclick = async () => {
    if (!db) { st.textContent = "Chưa kết nối được nơi lưu. Mở lại trang trong Claude."; return; }
    b.disabled = true; st.textContent = "Đang lưu…";
    try {
      await db.doc("answers/" + q.id).set({ text: ta.value, updatedAt: new Date().toISOString() });
      answers[q.id] = ta.value; st.textContent = "Đã lưu ✓"; paint(q.id); progress();
    } catch (e) {
      st.textContent = e && e.code === "invalid_argument"
        ? "Bạn không có quyền lưu ở trang này." : "Chưa lưu được. Thử bấm Lưu lại.";
    } finally { b.disabled = false; }
  };
  cards[q.id] = { el, ta, st, fb, chip };
  return el;
}

function paint(id){
  const c = cards[id]; if (!c) return;
  const has = !!(answers[id] || "").trim();
  c.el.classList.toggle("done", has);
  c.chip.textContent = has ? "Đã làm" : "Chưa làm";
  const f = feedback[id];
  c.fb.hidden = !f;
  c.fb.textContent = "";
  if (f) { const b = document.createElement("b"); b.textContent = "Claude nhận xét"; c.fb.append(b, document.createTextNode(f)); }
}

function render(db){
  const list = $("#list"); list.textContent = "";
  for (const k in cards) delete cards[k];
  if (!questions.length) {
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = "Chưa có bài tập nào. Nhắn Claude để thêm câu hỏi.";
    list.append(p); progress(); return;
  }
  questions.forEach((q, i) => list.append(card(q, i, db)));
  questions.forEach(q => { cards[q.id].ta.value = answers[q.id] || ""; paint(q.id); });
  progress();
}

(async () => {
  const db = window.claude ? await window.claude.use("db") : null;
  if (!db) { $("#empty").textContent = "Không mở được nơi lưu bài. Hãy mở trang này trong Claude khi đã đăng nhập."; return; }
  const timer = setTimeout(() => { if (!questions.length) $("#empty").textContent = "Chưa tải được bài tập. Kiểm tra mạng rồi đợi thêm chút."; }, 10000);
  const fail = () => { clearTimeout(timer); $("#empty") && ($("#empty").textContent = "Không tải được bài tập. Mở lại trang sau."); };

  db.collection("questions").orderBy("order").onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    questions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // keep unsaved typing across re-renders
    const drafts = {}; for (const k in cards) drafts[k] = cards[k].ta.value;
    render(db);
    for (const k in drafts) if (cards[k] && drafts[k] !== (answers[k] || "")) cards[k].ta.value = drafts[k];
  }, fail);

  db.collection("answers").onSnapshot(snap => {
    answers = {}; snap.docs.forEach(d => { answers[d.id] = d.data().text || ""; });
    for (const id in cards) { if (document.activeElement !== cards[id].ta && !cards[id].ta.value) cards[id].ta.value = answers[id] || ""; paint(id); }
    progress();
  }, () => {});

  db.collection("feedback").onSnapshot(snap => {
    feedback = {}; snap.docs.forEach(d => { feedback[d.id] = d.data().text || ""; });
    for (const id in cards) paint(id);
  }, () => {});
})();
</script>
